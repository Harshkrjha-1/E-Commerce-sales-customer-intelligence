services:
  - type: web
    name: olist-analytics-backend
    env: python
    buildCommand: pip install -r requirements.txt && python backend/seed_db.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.5
      - key: DATABASE_URL
        fromDatabase:
          name: olist-postgres
          property: connectionString

databases:
  - name: olist-postgres
    databaseName: olist_db
    user: olist_user
